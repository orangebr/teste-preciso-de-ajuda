<!doctype html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Resultados do teste</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600&display=swap">
<style>
  /* ══════════════════════════════════════════════════════════════════════
     Mesma linguagem da tela "Detalhes da avaliação" do Feedback, transcrita
     de AdministrativeSupportPage/components/Tabs/SurveyDetail/styles.ts:
     cartão branco de 16px com filete #F0F0F0, título de 12px em #676767,
     número de 40px com letter-spacing -1px, donut de 90px com recorte de 68%
     e a faixa de funil discreta embaixo.

     Tema claro só, como a tela original — mas com toda cor declarada, para a
     página não pegar emprestado o fundo de ninguém.

     As três cores de status (#00AB50 / #EBA417 / #CC221F) são as do donut do
     produto. O validador de paleta aponta separação de ΔE 6,0 entre verde e
     amarelo em protanopia: banda que só vale com codificação secundária, e
     por isso cada fatia tem nome e número na legenda, e existe a mesma
     informação em tabela.
     ══════════════════════════════════════════════════════════════════════ */
  :root {
    color-scheme: light;
    --fundo:#F2F2F4;
    --card:#FFFFFF;
    --filete:#F0F0F0;
    --corpo:#333333;       /* BODY_TEXT */
    --secundario:#676767;  /* SECONDARY_TEXT */
    --tinta:#212121;
    --apagado:#BDBDBD;
    --trilho:#F0F0F2;
    --marca:#FA641E;
    --verde:#00AB50;
    --verde-forte:#008940;
    --amarelo:#EBA417;
    --vermelho:#CC221F;
    --roxo:#6366F1;
  }
  * { box-sizing:border-box; }
  body {
    margin:0; background:var(--fundo); color:var(--corpo);
    font-family:Poppins,system-ui,-apple-system,sans-serif;
    -webkit-font-smoothing:antialiased;
  }
  .num { font-variant-numeric:tabular-nums; }

  /* ── Cabeçalho ─────────────────────────────────────────────────────── */
  .topo { display:flex; align-items:center; gap:16px; width:100%; padding:12px 24px; flex-wrap:wrap; }
  .topo .textos { display:flex; flex:1; flex-direction:column; align-items:flex-start; gap:4px; min-width:0; }
  .migalha { display:flex; align-items:center; gap:8px; font-size:12px; line-height:18px; color:var(--secundario); }
  .migalha b { color:var(--corpo); font-weight:500; }
  h1 { font-weight:500; font-size:20px; line-height:28px; color:var(--corpo); margin:0; }
  .btn {
    display:inline-flex; align-items:center; justify-content:center; gap:7px;
    height:40px; flex-shrink:0; padding:0 16px; border:none; border-radius:8px;
    font-family:Poppins; font-weight:600; font-size:12px; line-height:16px; cursor:pointer;
    transition:background-color .16s ease, opacity .16s ease;
    background:var(--card); color:var(--secundario);
  }
  .btn:hover { background:#F5F5F5; }
  .btn.primario { background:var(--verde-forte); color:#fff; }
  .btn.primario:hover { background:#006730; }
  .btn.ligado { background:var(--marca); color:#fff; }
  .btn:disabled { opacity:.55; cursor:default; }
  .pulso { width:7px; height:7px; border-radius:50%; background:#fff; }

  main { display:flex; flex-direction:column; gap:16px; width:100%; padding:0 24px 32px; max-width:1280px; margin:0 auto; }

  /* ── KPIs ──────────────────────────────────────────────────────────── */
  .kpis { display:grid; grid-template-columns:repeat(auto-fit,minmax(300px,1fr)); gap:16px; width:100%; }
  .kpi {
    display:flex; flex-direction:column; gap:10px; min-height:132px; padding:20px;
    border:1px solid var(--filete); border-radius:16px; background:var(--card);
  }
  .kpi-cab { display:flex; align-items:center; justify-content:space-between; gap:20px; }
  .kpi-tit { font-weight:500; font-size:12px; line-height:18px; color:var(--secundario); }
  .info {
    width:16px; height:16px; flex:none; border-radius:50%; border:1px solid #E0E0E0;
    color:var(--apagado); font-size:10px; line-height:14px; text-align:center; cursor:help;
  }
  .kpi-corpo { display:flex; flex:1; align-items:center; gap:12px; min-width:0; }
  .kpi-bloco { display:flex; flex:1 1 70px; flex-direction:column; min-width:70px; }
  .grande { font-weight:600; font-size:40px; line-height:48px; letter-spacing:-1px; color:var(--tinta); }
  .grande.verde { color:var(--verde); }
  .pe { display:flex; align-items:center; gap:4px; padding-top:6px; font-size:11px; line-height:16.5px; color:var(--secundario); }

  .legenda { display:flex; flex:1 1 auto; flex-direction:column; gap:4px; min-width:0; font-size:11px; line-height:16.5px; color:var(--secundario); }
  .legenda .l { display:flex; align-items:center; gap:5px; min-width:0; white-space:nowrap; }
  .legenda .p { width:8px; height:8px; flex-shrink:0; border-radius:4px; }
  .legenda .v { font-weight:600; color:var(--tinta); }

  .estrelas-linha { display:flex; align-items:center; gap:2px; }
  .estrelas-linha svg { width:18px; height:18px; }

  /* ── Funil ─────────────────────────────────────────────────────────── */
  .funil {
    display:flex; align-items:center; flex-wrap:wrap; gap:8px 14px;
    padding:12px 16px; width:100%; background:var(--card); border-radius:12px;
  }
  .funil .item { display:flex; align-items:baseline; gap:6px; }
  .funil .valor { font-weight:600; font-size:14px; color:var(--corpo); }
  .funil .pct { font-size:11px; color:var(--secundario); }
  .funil .rot { font-size:12px; color:var(--secundario); }
  .funil .seta { font-size:12px; color:var(--apagado); }

  /* ── Cartões de resultado ──────────────────────────────────────────── */
  .cartoes { display:flex; align-items:stretch; flex-wrap:wrap; gap:16px; width:100%; }
  .cartao {
    display:flex; flex:1 1 440px; flex-direction:column; min-width:0; padding:20px;
    border:0.7px solid var(--filete); border-radius:16px; background:var(--card);
  }
  .cartao.inteiro { flex-basis:100%; }
  .selo { padding:2px 8px; border-radius:999px; font-weight:500; font-size:11px; line-height:16.5px; align-self:flex-start; }
  .cartao h2 { padding-top:8px; font-weight:500; font-size:14px; line-height:21px; color:var(--corpo); margin:0; }
  .cartao .apoio { font-size:11px; line-height:16.5px; color:var(--secundario); margin:6px 0 0; }
  .cartao .conteudo { margin-top:18px; }

  .barras { display:flex; flex-direction:column; gap:10px; }
  .barra { display:grid; grid-template-columns:minmax(78px,auto) 1fr 36px; gap:12px; align-items:center; font-size:12px; }
  .barra .rot { color:var(--corpo); overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .barra .trilho { background:var(--trilho); border-radius:4px; height:14px; overflow:hidden; }
  .barra .vale { height:100%; background:var(--marca); border-radius:0 4px 4px 0; min-width:2px; transition:width .25s ease; }
  .barra .qtd { text-align:right; color:var(--secundario); }

  details { margin-top:16px; }
  summary { font-size:11px; line-height:16.5px; color:var(--secundario); cursor:pointer; }
  table { width:100%; border-collapse:collapse; margin-top:10px; font-size:12px; }
  th, td { text-align:left; padding:8px; border-bottom:1px solid var(--filete); white-space:nowrap; }
  th { font-weight:500; color:var(--secundario); font-size:11px; }
  td.n, th.n { text-align:right; }
  .rolar { overflow-x:auto; }
  .rolar table { min-width:780px; }
  a { color:var(--marca); text-decoration:none; font-weight:500; }
  a:hover { text-decoration:underline; }
  .ponto { width:8px; height:8px; border-radius:50%; flex:none; display:inline-block; margin-right:7px; vertical-align:middle; }

  .vazio { padding:24px; border:1px solid var(--filete); border-radius:16px; background:var(--card); color:var(--secundario); font-size:13px; line-height:21px; }
  .vazio b { color:var(--corpo); }

  /* Donut: mesmo desenho do NpsDonut — 90px, recorte de 68%, com a dica em
     HTML por cima (dentro do canvas ela sairia cortada). */
  .donut { position:relative; width:90px; height:90px; flex-shrink:0; }
  .donut svg { transform:rotate(-90deg); }
  .donut circle { fill:none; stroke-width:14.4; transition:opacity .15s ease; }
  .donut:hover circle { opacity:.45; }
  .donut circle:hover { opacity:1; }
  .dica {
    position:absolute; left:50%; bottom:100%; z-index:50; margin-bottom:6px;
    transform:translateX(-50%); padding:4px 8px; border-radius:6px;
    background:rgba(33,33,33,.92); white-space:nowrap; pointer-events:none;
    font-weight:500; font-size:11px; line-height:16px; color:#fff;
  }
</style>
</head>
<body>

<div class="topo">
  <div class="textos">
    <div class="migalha"><span>Usabilidade</span><span>›</span><b>Preciso de ajuda</b></div>
    <h1>Resultados do teste de usabilidade</h1>
  </div>
  <button class="btn" id="btn-testes" type="button">Mostrar testes internos</button>
  <button class="btn" id="btn-avisar" type="button" title="Aviso do sistema quando entrar uma sessão nova">Avisar quando chegar</button>
  <button class="btn primario" id="btn-atualizar" type="button">Atualizar</button>
</div>

<main id="painel">
  <div class="vazio">Buscando as sessões no repositório…</div>
</main>

<script>
/* As sessões moram em respostas/ neste repositório e são lidas pela API
   pública do GitHub — sem token, porque o repositório é público.

   O .json de cada sessão carrega o replay inteiro (centenas de KB). Baixar
   tudo a cada visita seria lento e queimaria o limite de 60 chamadas por
   hora, então cada arquivo é lido UMA vez e o navegador guarda só o resumo
   extraído — nunca o replay. A chave é o sha: mudou o conteúdo, muda o sha e
   ele é lido de novo. */
const REPO = 'orangebr/teste-preciso-de-ajuda';
const PASTA = 'respostas';
const API = 'https://api.github.com/repos/' + REPO + '/contents/' + PASTA;
const CACHE = 'resultados-teste-v2';
const INTERVALO_MS = 60000;

const cache = carregarCache();
let sessoes = [];
let mostrarTestes = false;
const jaVistas = new Set();
let avisarLigado = false;

function carregarCache() {
  try { return JSON.parse(localStorage.getItem(CACHE) || '{}'); } catch (e) { return {}; }
}
function salvarCache() {
  try { localStorage.setItem(CACHE, JSON.stringify(cache)); } catch (e) { /* janela privada */ }
}

/* ── Leitura ──────────────────────────────────────────────────────────── */

async function buscar() {
  const r = await fetch(API, { headers: { Accept: 'application/vnd.github+json' }, cache: 'no-store' });
  if (r.status === 403) throw new Error('limite-de-chamadas');
  if (!r.ok) throw new Error('HTTP ' + r.status);
  const arquivos = (await r.json()).filter((f) => f.name.endsWith('.json'));

  const lidas = [];
  for (const f of arquivos) {
    if (cache[f.sha]) { lidas.push(cache[f.sha]); continue; }
    try {
      const bruto = await fetch(f.download_url, { cache: 'no-store' }).then((x) => x.json());
      cache[f.sha] = resumir(bruto, f.name);
      lidas.push(cache[f.sha]);
    } catch (e) { /* arquivo pela metade: ignora e segue */ }
  }
  salvarCache();
  lidas.sort((a, b) => (b.quando || '').localeCompare(a.quando || ''));
  return lidas;
}

function resumir(bruto, arquivo) {
  const d = bruto.dados || {};
  const f = d.form || {};
  const draft = d.draft || {};
  const marcos = Array.isArray(d.marcos) ? d.marcos : [];
  const abriu = marcos.find((m) => m.evento === 'abriu-ajuda');

  return {
    id: bruto.sessionId || d.sessionId || arquivo,
    arquivo,
    /* Sessão de verdade tem linha do tempo; os disparos de fumaça do
       desenvolvimento chegam com `dados` vazio. */
    real: marcos.length > 0,
    quando: d.abertoEm || '',
    duracao: d.duracaoTotalSegundos || 0,
    segundosAteAjuda: abriu ? abriu.emSegundos : null,
    convites: (d.convites || []).length,
    protocolo: d.protocolo || null,
    tarefa: draft.taskId || null,
    relato: (draft.description || '').trim().length,
    estrelas: f.estrelas || 0,
    conseguiu: f.conseguiu || '',
    nps: (f.nps === 0 || f.nps) ? f.nps : null,
    comentario: (f.comentario || '').trim(),
    verMais: Boolean(d.verMaisAberto),
    barrado: (d.barradoEm || []).length,
    cliquesMortos: marcos.filter((m) => m.evento === 'clique-sem-resposta').map((m) => m.detalhe).filter(Boolean),
  };
}

/* ── Contas ───────────────────────────────────────────────────────────── */

const mediana = (lista) => {
  const v = lista.filter((x) => typeof x === 'number').sort((a, b) => a - b);
  if (!v.length) return null;
  const m = Math.floor(v.length / 2);
  return v.length % 2 ? v[m] : (v[m - 1] + v[m]) / 2;
};
const pct = (parte, todo) => (todo ? Math.round((parte / todo) * 100) : 0);
const tempo = (s) => (s == null ? '—' : (s < 60 ? Math.round(s) + 's' : Math.floor(s / 60) + 'min ' + String(Math.round(s % 60)).padStart(2, '0') + 's'));
const contar = (lista) => lista.reduce((m, x) => (m[x] = (m[x] || 0) + 1, m), {});
const escapar = (t) => String(t).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/"/g, '&quot;');

const TAREFAS = {
  pedido:'Problemas com pedido', produto:'Produto ou cardápio', caixa:'Abrir ou fechar caixa',
  acesso:'Acesso e senhas', imprimir:'Impressões', relatorio:'Tirar um relatório',
  fatura:'Mensalidade ou fatura', nota:'Nota fiscal', entrega:'Entrega e entregador',
  dados:'Dados da loja', visibilidade:'Cliente não acha a loja', naosei:'Não sei dizer',
};

/* ── Peças ────────────────────────────────────────────────────────────── */

/** Donut de 90px com recorte de 68%, como o NpsDonut do produto. A folga de
    2px entre fatias é o espaçador que separa cores vizinhas. */
function donut(fatias) {
  const total = fatias.reduce((s, f) => s + f.valor, 0);
  if (!total) return '<div class="donut"></div>';
  const r = 37.8, circ = 2 * Math.PI * r;
  let offset = 0;
  const arcos = fatias.filter((f) => f.valor > 0).map((f) => {
    const parte = (f.valor / total) * circ;
    const traco = Math.max(parte - 2, 0.5);
    const c = '<circle cx="45" cy="45" r="' + r + '" stroke="' + f.cor + '"' +
      ' stroke-dasharray="' + traco + ' ' + (circ - traco) + '"' +
      ' stroke-dashoffset="' + (-offset) + '">' +
      '<title>' + escapar(f.rotulo) + ': ' + f.valor + ' (' + pct(f.valor, total) + '%)</title></circle>';
    offset += parte;
    return c;
  }).join('');
  return '<div class="donut"><svg viewBox="0 0 90 90" width="90" height="90" role="img" aria-label="' +
    escapar(fatias.map((f) => f.rotulo + ' ' + f.valor).join(', ')) + '">' + arcos + '</svg></div>';
}

function legenda(fatias) {
  const total = fatias.reduce((s, f) => s + f.valor, 0) || 1;
  return '<div class="legenda">' + fatias.map((f) =>
    '<div class="l"><span class="p" style="background:' + f.cor + '"></span>' + f.rotulo +
    ' <span class="v num">' + pct(f.valor, total) + '%</span></div>').join('') + '</div>';
}

function estrelasSvg(n) {
  const estrela = (cheia) => '<svg viewBox="0 0 24 24" fill="' + (cheia ? '#FA641E' : '#E0E0E0') +
    '" aria-hidden="true"><path d="M12 17.27L18.18 21l-1.64-7.03L22 9.24l-7.19-.61L12 2 9.19 8.63 2 9.24l5.46 4.73L5.82 21z"/></svg>';
  return '<span class="estrelas-linha">' + [1,2,3,4,5].map((i) => estrela(i <= Math.round(n))).join('') + '</span>';
}

function barras(itens) {
  const maior = Math.max(1, ...itens.map((i) => i.valor));
  return '<div class="barras">' + itens.map((i) =>
    '<div class="barra" title="' + escapar(i.rotulo) + ': ' + i.valor + '">' +
      '<span class="rot">' + escapar(i.rotulo) + '</span>' +
      '<span class="trilho"><span class="vale" style="width:' + Math.round((i.valor / maior) * 100) + '%"></span></span>' +
      '<span class="qtd num">' + i.valor + '</span></div>').join('') + '</div>';
}

function tabela(cabecalhos, linhas) {
  return '<details><summary>Ver como tabela</summary><table><thead><tr>' +
    cabecalhos.map((c, i) => '<th' + (i ? ' class="n"' : '') + '>' + c + '</th>').join('') +
    '</tr></thead><tbody>' + linhas.map((l) => '<tr>' +
      l.map((c, i) => '<td' + (i ? ' class="n num"' : '') + '>' + c + '</td>').join('') +
    '</tr>').join('') + '</tbody></table></details>';
}

function cartao(selo, corSelo, titulo, apoio, conteudo, inteiro) {
  return '<div class="cartao' + (inteiro ? ' inteiro' : '') + '">' +
    '<span class="selo" style="color:' + corSelo + ';background:' + corSelo + '17">' + selo + '</span>' +
    '<h2>' + titulo + '</h2>' +
    (apoio ? '<p class="apoio">' + apoio + '</p>' : '') +
    '<div class="conteudo">' + conteudo + '</div></div>';
}

/* ── Desenho ──────────────────────────────────────────────────────────── */

function pintar() {
  const v = sessoes.filter((s) => mostrarTestes || s.real);
  const painel = document.getElementById('painel');

  if (!v.length) {
    painel.innerHTML = '<div class="vazio"><b>Nenhuma sessão ainda.</b> Assim que um lojista terminar o teste, ' +
      'o arquivo aparece em <code>respostas/</code> e este painel conta sozinho.</div>';
    return;
  }

  const avaliaram = v.filter((s) => s.nps !== null);
  const abriramChamado = v.filter((s) => s.protocolo);
  const acharam = v.filter((s) => s.segundosAteAjuda != null);
  const sozinhos = acharam.filter((s) => s.convites === 0);
  const comDica = acharam.length - sozinhos.length;
  const naoAcharam = v.length - acharam.length;

  const nps = avaliaram.map((s) => s.nps);
  const prom = nps.filter((n) => n >= 9).length;
  const neu = nps.filter((n) => n >= 7 && n <= 8).length;
  const det = nps.filter((n) => n <= 6).length;
  const npsMedia = nps.length ? (nps.reduce((a, b) => a + b, 0) / nps.length) : null;

  const estrelas = avaliaram.map((s) => s.estrelas).filter(Boolean);
  const mediaEstrelas = estrelas.length ? estrelas.reduce((a, b) => a + b, 0) / estrelas.length : null;
  const conseguiu = contar(avaliaram.map((s) => s.conseguiu).filter(Boolean));
  const tarefas = contar(v.map((s) => s.tarefa).filter(Boolean));
  const mortos = contar(v.flatMap((s) => s.cliquesMortos));

  const fatiasAjuda = [
    { rotulo:'Sozinhos', valor:sozinhos.length, cor:'var(--verde)' },
    { rotulo:'Depois da dica', valor:comDica, cor:'var(--amarelo)' },
    { rotulo:'Não acharam', valor:naoAcharam, cor:'var(--vermelho)' },
  ];
  const fatiasNps = [
    { rotulo:'Promotores', valor:prom, cor:'var(--verde)' },
    { rotulo:'Neutros', valor:neu, cor:'var(--amarelo)' },
    { rotulo:'Detratores', valor:det, cor:'var(--vermelho)' },
  ];

  const funil = [
    { rot:'Abriram o teste', valor:v.length, pct:100 },
    { rot:'Acharam a ajuda', valor:acharam.length, pct:pct(acharam.length, v.length) },
    { rot:'Abriram o chamado', valor:abriramChamado.length, pct:pct(abriramChamado.length, v.length) },
    { rot:'Avaliaram', valor:avaliaram.length, pct:pct(avaliaram.length, v.length) },
  ];

  painel.innerHTML = `
    <div class="kpis">
      <div class="kpi">
        <div class="kpi-cab"><span class="kpi-tit">Sessões recebidas</span>
          <span class="info" title="Cada lojista que abriu o teste e chegou a gerar um arquivo.">i</span></div>
        <div class="kpi-corpo"><div class="kpi-bloco">
          <div class="grande num">${v.length}</div>
          <div class="pe">${avaliaram.length} responderam a avaliação</div>
        </div></div>
      </div>

      <div class="kpi">
        <div class="kpi-cab"><span class="kpi-tit">Acharam a ajuda</span>
          <span class="info" title="A pergunta central do teste. Sozinhos = abriram o “?” sem o teste dar nenhuma dica.">i</span></div>
        <div class="kpi-corpo">
          <div class="kpi-bloco">
            <div class="grande num ${sozinhos.length === v.length ? 'verde' : ''}">${pct(sozinhos.length, v.length)}%</div>
            <div class="pe">sozinhos, sem dica</div>
          </div>
          ${donut(fatiasAjuda)}
          ${legenda(fatiasAjuda)}
        </div>
      </div>

      <div class="kpi">
        <div class="kpi-cab"><span class="kpi-tit">NPS</span>
          <span class="info" title="Promotores 9–10, neutros 7–8, detratores 0–6.">i</span></div>
        <div class="kpi-corpo">
          <div class="kpi-bloco">
            <div class="grande num ${npsMedia >= 9 ? 'verde' : ''}">${npsMedia === null ? '—' : npsMedia.toFixed(2)}</div>
            <div class="pe">${nps.length} ${nps.length === 1 ? 'resposta' : 'respostas'}</div>
          </div>
          ${nps.length ? donut(fatiasNps) + legenda(fatiasNps) : ''}
        </div>
      </div>

      <div class="kpi">
        <div class="kpi-cab"><span class="kpi-tit">Tempo até achar o “?”</span>
          <span class="info" title="Mediana do tempo entre abrir o teste e abrir a ajuda.">i</span></div>
        <div class="kpi-corpo"><div class="kpi-bloco">
          <div class="grande num">${tempo(mediana(v.map((s) => s.segundosAteAjuda)))}</div>
          <div class="pe">teste inteiro em ${tempo(mediana(avaliaram.map((s) => s.duracao)))}</div>
        </div></div>
      </div>

      <div class="kpi">
        <div class="kpi-cab"><span class="kpi-tit">Satisfação</span>
          <span class="info" title="“Como foi pedir ajuda nessa tela?”">i</span></div>
        <div class="kpi-corpo">
          <div class="kpi-bloco">
            <div class="grande num">${mediaEstrelas ? mediaEstrelas.toFixed(1) : '—'}</div>
            <div class="pe">de 5 · ${estrelas.length} ${estrelas.length === 1 ? 'avaliação' : 'avaliações'}</div>
          </div>
          ${mediaEstrelas ? estrelasSvg(mediaEstrelas) : ''}
        </div>
      </div>

      <div class="kpi">
        <div class="kpi-cab"><span class="kpi-tit">Chamados abertos</span>
          <span class="info" title="Sessões que chegaram ao fim do fluxo e enviaram o chamado.">i</span></div>
        <div class="kpi-corpo"><div class="kpi-bloco">
          <div class="grande num">${pct(abriramChamado.length, v.length)}%</div>
          <div class="pe">${abriramChamado.length} de ${v.length} · relato mediano de ${mediana(v.map((s) => s.relato).filter((n) => n > 0)) || '—'} caracteres</div>
        </div></div>
      </div>
    </div>

    <div class="funil">
      ${funil.map((f, i) => (i ? '<span class="seta">→</span>' : '') +
        '<div class="item"><span class="valor num">' + f.valor + '</span>' +
        '<span class="pct num">(' + f.pct + '%)</span>' +
        '<span class="rot">' + f.rot + '</span></div>').join('')}
    </div>

    <div class="cartoes">
      ${cartao('Estrelas', '#FA641E', 'Como foi pedir ajuda nessa tela?',
        'Distribuição das notas de 1 a 5.',
        barras([5,4,3,2,1].map((n) => ({ rotulo:n + ' estrela' + (n > 1 ? 's' : ''), valor:estrelas.filter((e) => e === n).length }))) +
        tabela(['Nota','Sessões','%'], [5,4,3,2,1].map((n) => {
          const q = estrelas.filter((e) => e === n).length;
          return [n + ' ★', q, pct(q, estrelas.length) + '%'];
        })))}

      ${cartao('Escolha única', '#6366F1', 'Você conseguiu avisar o problema sozinho?',
        'O que a pessoa disse, depois de fazer.',
        (avaliaram.length
          ? '<div class="kpi-corpo">' + donut([
              { rotulo:'Sim, sozinho', valor:conseguiu.sozinho || 0, cor:'var(--verde)' },
              { rotulo:'Travei em algum ponto', valor:conseguiu.travei || 0, cor:'var(--amarelo)' },
              { rotulo:'Não consegui', valor:conseguiu.nao || 0, cor:'var(--vermelho)' },
            ]) + legenda([
              { rotulo:'Sim, sozinho', valor:conseguiu.sozinho || 0, cor:'var(--verde)' },
              { rotulo:'Travei em algum ponto', valor:conseguiu.travei || 0, cor:'var(--amarelo)' },
              { rotulo:'Não consegui', valor:conseguiu.nao || 0, cor:'var(--vermelho)' },
            ]) + '</div>'
          : '<p class="apoio">sem respostas ainda</p>') +
        tabela(['Resposta','Sessões'], [
          ['Sim, sozinho', conseguiu.sozinho || 0],
          ['Travei em algum ponto', conseguiu.travei || 0],
          ['Não consegui', conseguiu.nao || 0],
        ]))}

      ${cartao('Comportamento', '#00AB50', 'Onde clicaram sem obter resposta',
        'Cada clique em algo que não reage — o mapa de onde o lojista procura ajuda antes de achar o “?”.',
        Object.keys(mortos).length
          ? barras(Object.entries(mortos).sort((a, b) => b[1] - a[1]).slice(0, 8)
              .map(([k, q]) => ({ rotulo:k.length > 30 ? k.slice(0, 29) + '…' : k, valor:q })))
          : '<p class="apoio">ninguém clicou fora — bom sinal</p>')}

      ${cartao('Comportamento', '#00AB50', 'Tarefa escolhida no primeiro passo',
        'Se a tarefa certa estiver quase sempre atrás do “Ver mais”, a ordem do catálogo está errada. ' +
        'Abriram o “Ver mais”: <b>' + v.filter((s) => s.verMais).length + ' de ' + v.length + '</b>. ' +
        'Barrados por campo faltando: <b>' + v.filter((s) => s.barrado).length + '</b>.',
        Object.keys(tarefas).length
          ? barras(Object.entries(tarefas).sort((a, b) => b[1] - a[1]).map(([k, q]) => ({ rotulo:TAREFAS[k] || k, valor:q })))
          : '<p class="apoio">ninguém chegou a escolher</p>')}

      ${cartao('Respostas', '#676767', 'Sessão a sessão',
        'O ponto é verde quando a pessoa terminou sem ajuda, amarelo quando precisou de dica e vermelho quando abandonou. ' +
        'O <b>*</b> marca quem só achou o “?” depois da dica.',
        '<div class="rolar"><table><thead><tr>' +
          '<th>Quando</th><th class="n">Duração</th><th class="n">Achou em</th><th>Chamado</th>' +
          '<th class="n">★</th><th class="n">NPS</th><th>Comentário</th><th></th></tr></thead><tbody>' +
        v.map((s) => '<tr>' +
          '<td><span class="ponto" style="background:' + (s.nps === null ? 'var(--vermelho)' : (s.convites ? 'var(--amarelo)' : 'var(--verde)')) + '"></span>' + quando(s.quando) + '</td>' +
          '<td class="n num">' + tempo(s.duracao) + '</td>' +
          '<td class="n num">' + (s.segundosAteAjuda == null ? 'não achou' : tempo(s.segundosAteAjuda) + (s.convites ? ' *' : '')) + '</td>' +
          '<td>' + (s.protocolo || '—') + '</td>' +
          '<td class="n num">' + (s.estrelas || '—') + '</td>' +
          '<td class="n num">' + (s.nps === null ? '—' : s.nps) + '</td>' +
          '<td title="' + escapar(s.comentario) + '">' + (s.comentario ? escapar(s.comentario.length > 36 ? s.comentario.slice(0, 35) + '…' : s.comentario) : '—') + '</td>' +
          '<td><a href="player.html?f=' + PASTA + '/' + s.arquivo + '" target="_blank" rel="noopener">assistir</a></td>' +
        '</tr>').join('') + '</tbody></table></div>', true)}
    </div>
  `;

  document.querySelector('.migalha b').textContent =
    'Preciso de ajuda · ' + v.length + ' ' + (v.length === 1 ? 'sessão' : 'sessões') + ' · última ' + haQuanto(v[0].quando);
}

function quando(iso) {
  if (!iso) return '—';
  return new Date(iso).toLocaleString('pt-BR', { day:'2-digit', month:'2-digit', hour:'2-digit', minute:'2-digit' });
}
function haQuanto(iso) {
  if (!iso) return 'agora';
  const min = Math.round((Date.now() - new Date(iso).getTime()) / 60000);
  if (min < 1) return 'agora mesmo';
  if (min < 60) return 'há ' + min + ' min';
  const h = Math.round(min / 60);
  return h < 24 ? 'há ' + h + 'h' : 'há ' + Math.round(h / 24) + ' dias';
}

/* ── Chegada de sessão nova ───────────────────────────────────────────── */

function avisarNovas(lista) {
  const reais = lista.filter((s) => s.real);
  const novas = reais.filter((s) => !jaVistas.has(s.id));
  reais.forEach((s) => jaVistas.add(s.id));
  if (!novas.length || !avisarLigado) return;
  if (!('Notification' in window) || Notification.permission !== 'granted') return;
  new Notification(novas.length === 1 ? 'Chegou uma resposta do teste' : 'Chegaram ' + novas.length + ' respostas', {
    body: novas.length === 1
      ? (novas[0].nps === null ? 'Sessão abandonada — vale assistir' : 'NPS ' + novas[0].nps + ' · ' + novas[0].estrelas + ' estrelas')
      : 'Abra o painel para ver',
    tag: 'teste-preciso-de-ajuda',
  });
}

document.getElementById('btn-avisar').addEventListener('click', async () => {
  if (!('Notification' in window)) { alert('Este navegador não tem avisos de sistema.'); return; }
  const p = Notification.permission === 'granted' ? 'granted' : await Notification.requestPermission();
  avisarLigado = p === 'granted';
  const b = document.getElementById('btn-avisar');
  b.classList.toggle('ligado', avisarLigado);
  b.innerHTML = avisarLigado ? '<span class="pulso"></span>Avisando' : 'Avisar quando chegar';
});

document.getElementById('btn-testes').addEventListener('click', () => {
  mostrarTestes = !mostrarTestes;
  const b = document.getElementById('btn-testes');
  b.classList.toggle('ligado', mostrarTestes);
  b.textContent = mostrarTestes ? 'Ocultar testes internos' : 'Mostrar testes internos';
  pintar();
});

document.getElementById('btn-atualizar').addEventListener('click', () => atualizar(true));

async function atualizar(manual) {
  const b = document.getElementById('btn-atualizar');
  b.disabled = true;
  b.textContent = 'Atualizando…';
  try {
    sessoes = await buscar();
    avisarNovas(sessoes);
    pintar();
  } catch (e) {
    if (manual || !sessoes.length) {
      document.getElementById('painel').innerHTML = '<div class="vazio">' + (
        e.message === 'limite-de-chamadas'
          ? '<b>O GitHub limitou as chamadas desta rede</b> (60 por hora sem autenticação). As sessões já lidas ficam guardadas neste navegador; tente de novo daqui a pouco.'
          : '<b>Não consegui ler as sessões.</b> ' + escapar(e.message)
      ) + '</div>';
    }
  } finally {
    b.disabled = false;
    b.textContent = 'Atualizar';
  }
}

atualizar(false);
setInterval(() => atualizar(false), INTERVALO_MS);
</script>
